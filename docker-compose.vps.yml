networks:
    ivao-radar-net:
        driver: bridge
        internal: true

services:
    frontend:
        build:
            context: .
            dockerfile: .config/dev.Dockerfile
        image: vr-1.1.1
        env_file:
            - ./.env
        container_name: vatsim-radar
        expose:
            - 8180
            - 9229
        command: /radar/.config/command.sh
        restart: unless-stopped
        ports:
            - "127.0.0.1:8180:8080"
            - "127.0.0.1:9229:9229"
        volumes:
            - ".:/radar:rw"
        healthcheck:
            test: "bash -c 'echo -n > /dev/tcp/127.0.0.1/8180'"
            interval: 1s
            retries: 360
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - ivao-radar-net
        extra_hosts:
            - "host.docker.internal:host-gateway"

    worker:
        restart: unless-stopped
        build:
            context: .
            dockerfile: .config/dev.Dockerfile
        image: vr-1.1.1
        env_file:
            - ./.env
        container_name: vatsim-radar-worker
        command: /radar/.config/worker.sh
        volumes:
            - ".:/radar:rw"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
            frontend:
                condition: service_healthy
        networks:
            - ivao-radar-net
        extra_hosts:
            - "host.docker.internal:host-gateway"

    navigraph:
        restart: unless-stopped
        build:
            context: .
            dockerfile: .config/dev.Dockerfile
        image: vr-1.1.1
        env_file:
            - ./.env
        container_name: vatsim-radar-navigraph
        command: /radar/.config/navigraph.sh
        volumes:
            - ".:/radar:rw"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
            frontend:
                condition: service_healthy
        networks:
            - ivao-radar-net
        extra_hosts:
            - "host.docker.internal:host-gateway"

    db:
        image: mysql
        cap_add:
            - SYS_NICE
        container_name: vatsim-radar-db
        environment:
            - MYSQL_ALLOW_EMPTY_PASSWORD=yes
            - MYSQL_DATABASE=radar
            - MYSQL_ROOT_PASSWORD=localhost
        healthcheck:
            test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
            timeout: 5s
            interval: 5s
            retries: 40
        volumes:
            - .config/db:/var/lib/mysql
        networks:
            - ivao-radar-net

    redis:
        image: redis
        container_name: vatsim-radar-redis
        command: redis-server /usr/local/etc/redis/redis.conf --requirepass RADAR
        expose:
            - 6379
        environment:
            - REDIS_APPLICATION_MODE=master
        volumes:
            - ./.config/redis.conf:/usr/local/etc/redis/redis.conf
            - ./.config/redis:/data
        networks:
            - ivao-radar-net

    questdb:
        image: questdb/questdb:9.4.3
        container_name: vatsim-radar-questdb
        environment:
            - QDB_LOG_W_STDOUT_LEVEL=ERROR
            - QDB_SHARED_WORKER_COUNT=1
        volumes:
            - ./.config/questdb:/var/lib/questdb
        networks:
            - ivao-radar-net
        extra_hosts:
            - "host.docker.internal:host-gateway"
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name ivao-radar.com www.ivao-radar.com do.ivao-radar.com;

    location /ws {
        resolver 127.0.0.11;
        proxy_pass http://prod_ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ turns$ {
        resolver 127.0.0.11;
        proxy_pass http://prod_turns;
    }

    location / {
        resolver 127.0.0.11;
        proxy_pass http://prod;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name next.ivao-radar.com www.next.ivao-radar.com do-next.ivao-radar.com;

    location /ws {
        resolver 127.0.0.11;
        proxy_pass http://next_ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        resolver 127.0.0.11;
        proxy_pass http://next;
    }
}

services:
    frontend:
        image: ghcr.io/quales/vatsim-radar/next-prebuilt:latest
        container_name: vatsim-radar-prebuilt
        expose:
            - 3000
            - 8080
        ports:
            - '127.0.0.1:8080:3000'
            - '100.90.196.2:8080:3000'
        environment:
            - NITRO_HOST=0.0.0.0
        volumes:
            - "./app/data:/radar/app/data:rw"
        healthcheck:
            test: "bash -c 'echo -n > /dev/tcp/127.0.0.1/3000'"
            interval: 1s
            retries: 360
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
            questdb:
                condition: service_started
        extra_hosts:
            - "host.docker.internal:host-gateway"

    worker:
        image: ghcr.io/quales/vatsim-radar/next-prebuilt:latest
        container_name: vatsim-radar-prebuilt-worker
        ports:
            - '127.0.0.1:8880:8880'
            - '100.90.196.2:8880:8880'
        command: /radar/.config/worker-prod.sh
        volumes:
            - "./app/data:/radar/app/data:rw"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
            frontend:
                condition: service_healthy
            questdb:
                condition: service_started
        extra_hosts:
            - "host.docker.internal:host-gateway"

    navigraph:
        image: ghcr.io/quales/vatsim-radar/next-prebuilt:latest
        container_name: vatsim-radar-prebuilt-navigraph
        ports:
            - '127.0.0.1:3000:3000'
            - '100.90.196.2:3000:3000'
        command: /radar/.config/navigraph-prod.sh
        volumes:
            - "./app/data:/radar/app/data:rw"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
            frontend:
                condition: service_healthy
        extra_hosts:
            - "host.docker.internal:host-gateway"

    db:
        image: mysql
        container_name: vatsim-radar-prebuilt-db
        cap_add:
            - SYS_NICE
        environment:
            - MYSQL_ALLOW_EMPTY_PASSWORD=yes
            - MYSQL_DATABASE=radar
            - MYSQL_ROOT_PASSWORD=localhost
        ports:
            - '127.0.0.1:3307:3306'
            - '100.90.196.2:3307:3306'
        healthcheck:
            test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
            timeout: 5s
            interval: 5s
            retries: 40
        volumes:
            - .config/db:/var/lib/mysql
        extra_hosts:
            - "host.docker.internal:host-gateway"

    redis:
        image: redis
        container_name: vatsim-radar-prebuilt-redis
        command: redis-server /usr/local/etc/redis/redis.conf --requirepass RADAR
        expose:
            - 6379
        environment:
            - REDIS_APPLICATION_MODE=master
        volumes:
            - ./.config/redis.conf:/usr/local/etc/redis/redis.conf
            - ./.config/redis:/data
        extra_hosts:
            - "host.docker.internal:host-gateway"

    questdb:
        image: questdb/questdb:9.4.3
        container_name: vatsim-radar-prebuilt-questdb
        environment:
            - QDB_LOG_W_STDOUT_LEVEL=ERROR
            - QDB_SHARED_WORKER_COUNT=1
        ports:
            - "127.0.0.1:9000:9000"
            - "127.0.0.1:9009:9009"
            - "127.0.0.1:8812:8812"
            - "127.0.0.1:9003:9003"
            - "100.90.196.2:9000:9000"
            - "100.90.196.2:9009:9009"
            - "100.90.196.2:8812:8812"
            - "100.90.196.2:9003:9003"
        volumes:
            - ./.config/questdb:/var/lib/questdb
        extra_hosts:
            - "host.docker.internal:host-gateway"
